<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/>
<title>Сохранённые заявки — архив школы</title>
<script src="archive-store.js"></script>
<style>
:root{--bg:#fff8f3;--card:#fff;--ink:#1d1b18;--mut:#6d5859;--pri:#6c0c20;--line:#e7e1dc;--ok:#c9ead9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font:700 clamp(24px,6vw,34px)/1.2 "Playfair Display",Georgia,serif;color:var(--pri);margin:8px 0}
a{color:var(--pri)}
.note{background:#ffdea8;color:#271900;border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.bar input{flex:1 1 220px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:16px inherit;background:#fff}
button,.btn{min-height:44px;padding:8px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:700 13px Manrope,Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button.sec,.btn.sec{background:#ede7e2;color:var(--ink)}
button.del{background:#ffdad6;color:#93000a}
.count{color:var(--mut);font-size:14px;margin:4px 0 10px}
.item{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(44,40,36,.08)}
.item h2{margin:0;font:700 20px/1.3 "Playfair Display",Georgia,serif}
.meta{color:var(--mut);font-size:13px;margin:2px 0 10px}
dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
dt{font:700 12px Manrope,Arial,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
dd{margin:0 0 6px;overflow-wrap:anywhere;white-space:pre-wrap}
@media(min-width:640px){dl{grid-template-columns:200px minmax(0,1fr);gap:4px 14px}dd{margin:0}}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.f{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px;background:#fbf7f3}
.f img,.f video{width:100%;height:100px;object-fit:cover;display:block;background:#ddd}
.f .ph{height:100px;display:flex;align-items:center;justify-content:center;font:700 14px Manrope,Arial,sans-serif;color:var(--pri)}
.f div.n{padding:6px 8px;overflow-wrap:anywhere}
.f a{display:block;padding:0 8px 8px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style></head><body><div class="wrap">
<p><a href="index.html">← На главную</a></p>
<h1>Сохранённые заявки</h1>
<div class="note">Заявки хранятся только в браузере на этом устройстве (не на сервере). Чтобы не потерять данные, делайте резервную копию кнопкой «Резервная копия (JSON)» и не очищайте данные сайта в браузере.</div>
<div class="bar">
<input id="q" type="search" placeholder="Поиск по заявкам…" aria-label="Поиск"/>
<button id="csv" type="button">Скачать CSV</button>
<button id="json" type="button" class="sec">Резервная копия (JSON)</button>
<label class="btn sec" for="imp">Загрузить копию<input id="imp" type="file" accept="application/json,.json" hidden/></label>
<button id="clear" type="button" class="del">Удалить всё</button>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
</div>
<script>
(function(){
  var data=[], urls=[];
  var $=function(s){return document.querySelector(s)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(d){try{return new Date(d).toLocaleString('ru-RU')}catch(e){return d}}
  function size(n){return n>1048576?(n/1048576).toFixed(1)+' МБ':Math.max(1,Math.round(n/1024))+' КБ'}
  function title(r){var f=r.fields;for(var k in f){if(/назван|объект|тема|заголов/i.test(k)&&f[k])return f[k]}var v=Object.keys(f).map(function(k){return f[k]}).filter(Boolean);return v[0]||'Заявка'}
  function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
  function render(){
    urls.forEach(URL.revokeObjectURL);urls=[];
    var q=($('#q').value||'').toLowerCase();
    var rows=data.filter(function(r){return !q||JSON.stringify(r.fields).toLowerCase().indexOf(q)>-1||r.files.some(function(f){return f.name.toLowerCase().indexOf(q)>-1})});
    $('#count').textContent='Показано: '+rows.length+' из '+data.length;
    if(!rows.length){$('#list').innerHTML='<div class="empty">'+(data.length?'Ничего не найдено.':'Пока нет сохранённых заявок.')+'</div>';return}
    $('#list').innerHTML=rows.map(function(r){
      var f=Object.keys(r.fields).filter(function(k){return r.fields[k]!==''}).map(function(k){return '<dt>'+esc(k)+'</dt><dd>'+esc(r.fields[k])+'</dd>'}).join('');
      var fl=r.files.map(function(x,i){
        var u=URL.createObjectURL(x.blob);urls.push(u);
        var pv=/^image\//.test(x.type)?'<a href="'+u+'" target="_blank" rel="noopener" style="padding:0"><img src="'+u+'" alt=""/></a>':/^video\//.test(x.type)?'<video src="'+u+'" controls preload="metadata"></video>':'<div class="ph">'+esc((x.name.split('.').pop()||'файл').toUpperCase())+'</div>';
        return '<div class="f">'+pv+'<div class="n">'+esc(x.name)+'<br>'+size(x.size)+'</div><a href="'+u+'" download="'+esc(x.name)+'">Скачать</a></div>'}).join('');
      return '<article class="item"><h2>'+esc(title(r))+'</h2><div class="meta">'+fmt(r.date)+' · страница: '+esc(r.page)+'</div><dl>'+f+'</dl>'+(fl?'<div class="files">'+fl+'</div>':'')+'<p><button class="del" data-id="'+r.id+'" type="button">Удалить</button></p></article>'}).join('');
  }
  function load(){return ArchiveStore.all().then(function(a){data=(a||[]).sort(function(x,y){return y.date<x.date?-1:1});render()}).catch(function(e){$('#list').innerHTML='<div class="empty">Не удалось открыть хранилище: '+esc(e&&e.message)+'</div>'})}
  $('#q').addEventListener('input',render);
  $('#list').addEventListener('click',function(e){var b=e.target.closest('button[data-id]');if(!b)return;if(confirm('Удалить эту заявку вместе с файлами?'))ArchiveStore.remove(b.getAttribute('data-id')).then(load)});
  $('#clear').addEventListener('click',function(){if(data.length&&confirm('Удалить ВСЕ заявки без возможности восстановления? Сначала сделайте резервную копию.'))ArchiveStore.clear().then(load)});
  $('#csv').addEventListener('click',function(){
    var cols=['Дата','Страница'];data.forEach(function(r){Object.keys(r.fields).forEach(function(k){if(cols.indexOf(k)<0)cols.push(k)})});cols.push('Файлы');
    var q=function(v){v=String(v==null?'':v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var lines=[cols.map(q).join(';')];
    data.forEach(function(r){lines.push(cols.map(function(c){return c==='Дата'?fmt(r.date):c==='Страница'?r.page:c==='Файлы'?r.files.map(function(f){return f.name}).join(', '):r.fields[c]}).map(q).join(';'))});
    dl(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'zayavki.csv');
  });
  function b64(blob){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'')};fr.readAsDataURL(blob)})}
  $('#json').addEventListener('click',function(){
    Promise.all(data.map(function(r){return Promise.all(r.files.map(function(f){return b64(f.blob).then(function(d){return{name:f.name,type:f.type,size:f.size,data:d}})})).then(function(fs){return{id:r.id,date:r.date,page:r.page,fields:r.fields,files:fs}})})).then(function(all){
      dl(new Blob([JSON.stringify({version:1,items:all})],{type:'application/json'}),'archive-backup-'+new Date().toISOString().slice(0,10)+'.json')});
  });
  $('#imp').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;var fr=new FileReader();
    fr.onload=function(){try{
      var j=JSON.parse(fr.result),n=0;
      Promise.all((j.items||[]).map(function(r){
        r.files=(r.files||[]).map(function(x){var bin=atob(x.data||''),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return{name:x.name,type:x.type,size:x.size,blob:new Blob([a],{type:x.type})}});n++;return ArchiveStore.add(r)})).then(function(){alert('Загружено заявок: '+n);load()});
    }catch(e){alert('Не удалось прочитать файл копии.')}};
    fr.readAsText(f);this.value='';
  });
  load();
})();
</script></body></html>
